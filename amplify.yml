version: 1
applications:
  - appRoot: src
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20
            - npm ci
        build:
          commands:
            # Amplify passes the app's SSM SecureStrings to the build only, as the
            # JSON env var `secrets`. Next reads server env from .env.production at
            # runtime and inlines NEXT_PUBLIC_* at build, so write them first.
            # Key names are logged, never values.
            - node -e 'const s=JSON.parse(process.env.secrets||"{}");require("fs").writeFileSync(".env.production",Object.entries(s).map(([k,v])=>k+"="+v).join("\n")+"\n",{mode:0o600});console.log("runtime env keys:",Object.keys(s).join(", ")||"(none)")'
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    # Static files in public/ are served by Amplify's CDN and never reach
    # next.config headers(), so the service-worker rule and the security
    # baseline are repeated here (as netlify.toml's [[headers]] did).
    customHeaders:
      - pattern: '/sw.js'
        headers:
          - key: Cache-Control
            value: 'no-cache, max-age=0, must-revalidate'
          - key: Content-Type
            value: 'text/javascript; charset=utf-8'
      - pattern: '**/*'
        headers:
          - key: X-Frame-Options
            value: DENY
          - key: X-Content-Type-Options
            value: nosniff
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Permissions-Policy
            value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=()'

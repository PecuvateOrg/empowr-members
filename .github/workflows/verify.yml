# Runs the ops/scripts verify:* suites on every pull request.
#
# Why this exists: the suites are the only automated check on changes to a
# live booking, payment and waiver system, and until now nothing ran them —
# they were invoked by hand, if at all. A collaborator's pull request could
# reach main without a single test executing.
#
# `next lint` is deliberately not run here: it is deprecated in this Next
# version and drops into an interactive prompt with no ESLint config, so it
# cannot pass unattended. Fix the lint setup before adding it.
name: verify

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR supersedes the previous run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      # NOT netlify.toml's NODE_VERSION, which is 20. These suites are .ts
      # run directly by node --test, and native type stripping only exists
      # from Node 22 — on 20 every suite dies with ERR_UNKNOWN_FILE_EXTENSION
      # before asserting anything. They pass locally only because dev
      # machines are on 24. So they have never run on the deploy runtime.
      #
      # These are pure logic tests (zod schemas, date and pricing helpers)
      # with no runtime coupling, so validating them on 22 is sound. The
      # deploy/test runtime split is still worth closing: either bump
      # netlify.toml to 22, matching the rest of the estate, or add a type
      # stripper so they run on 20. That is a deploy change, not a CI one.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # DERIVED from package.json, never hand-listed. This step used to
      # enumerate the suites by name, and the list silently fell behind:
      # verify:public-ticket-visibility had never run in CI at all, and a
      # suite added in the same PR as its fix would likewise have gone
      # unexecuted while the check reported green. A gate that never fires
      # is indistinguishable from a gate that passes.
      #
      # The empty guard matters as much as the loop: if the query itself
      # ever breaks, this must go red rather than quietly run nothing.
      - name: Verify suites
        run: |
          suites=$(node -p "Object.keys(require('./package.json').scripts).filter(s => s.startsWith('verify:')).sort().join(' ')")
          if [ -z "$suites" ]; then
            echo "No verify:* scripts found - the suite query is broken."
            exit 1
          fi
          echo "Running: $suites"
          for suite in $suites; do
            echo "::group::$suite"
            npm run "$suite" || exit 1
            echo "::endgroup::"
          done

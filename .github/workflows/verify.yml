# Runs the ops/scripts verify:* suites on every pull request.
#
# Why this exists: the suites are the only automated check on changes to a
# live booking, payment and waiver system, and until now nothing ran them —
# they were invoked by hand, if at all. A collaborator's pull request could
# reach main without a single test executing.
#
# `next lint` is deliberately not run here: it is deprecated in this Next
# version and drops into an interactive prompt with no ESLint config, so it
# cannot pass unattended. Fix the lint setup before adding it.
name: verify

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR supersedes the previous run.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      # Matches NODE_VERSION in netlify.toml — CI must not pass on a runtime
      # the deploy does not use.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Verify suites
        run: |
          npm run verify:seasons
          npm run verify:register
          npm run verify:catalogue
          npm run verify:subscriptions
          npm run verify:cancellation
          npm run verify:departure-consent
          npm run verify:scheduled
          npm run verify:brevo
          npm run verify:auth-links
          npm run verify:emergency-contact

# The site is on AWS Amplify (since 2026-10-30) with PR previews off, as
# Netlify's were (2026-10-06). This posts a one-time reminder on each new PR
# to preview the branch locally instead.
name: Preview locally
on:
  pull_request:
    types: [opened]
permissions:
  pull-requests: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$PR" --repo "$REPO" --body "$BODY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BODY: "**No deploy preview for this PR.** The site runs on AWS Amplify with previews turned off. To review before merging, check out this branch, run `npm ci && npm run build && npm start` in `src/`, and open it locally. Maintainers merge and deploy; you never deploy."
